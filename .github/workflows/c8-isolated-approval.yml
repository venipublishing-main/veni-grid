name: C8 isolated PostgreSQL positive RLS and approval reference
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c8-postgresql:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: grid_c7_isolated
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grid_c7_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRID_C7_PG_DSN: postgresql://postgres:disposable-ci-only@localhost:5432/grid_c7_isolated
      GRID_C7_DISPOSABLE_ONLY: "YES"
      GRID_C8_DISPOSABLE_ONLY: "YES"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout with no persisted repository credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Configure Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install exact reviewed Grid dependencies
        run: |
          python -m pip install -c requirements-solver-reviewed.txt -e '.[solver,test,auth,postgres-test]'
          python -m pip check
      - name: Generate only synthetic solver fixtures
        run: |
          python -m scripts.prepare_workspace
          python -m scripts.run_c2_probes
          mkdir -p c8-output
      - name: Run all 683 inherited and C8 tests against disposable PostgreSQL 17
        run: >-
          python -m pytest -q tests tests_solver quality_tests q2_tests q3_tests
          o1_tests c2_tests c3_tests c4_tests c5_tests c6_tests c7_tests c8_tests
          --junitxml=c8-output/pytest-results.xml
      - name: Assert exact test count and no failures or skips
        run: |
          python - <<'PY'
          from xml.etree import ElementTree as ET
          r=ET.parse('c8-output/pytest-results.xml').getroot()
          x={k:sum(int(t.attrib.get(k,0)) for t in r.iter('testsuite'))
             for k in ('tests','failures','errors','skipped')}
          assert x=={'tests':683,'failures':0,'errors':0,'skipped':0},x
          print('C8 real PostgreSQL conformance:',x)
          PY
      - name: Produce actual C8 PostgreSQL reference receipt and human explanation
        run: python -m scripts.run_c8_receipt
      - name: Refuse false claims of live Supabase authority or publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('c8-output/c8-reference-summary.json').read_text())
          assert r['kind']=='C8_ISOLATED_POSTGRESQL_REFERENCE'
          assert r['executed_real_postgresql'] and r['postgresql_major']==17
          assert r['authenticated_member_sees_own_schedule']
          assert r['other_school_rows_visible']==0
          assert r['approved_revision']==2 and r['published_revision'] is None
          assert r['maker_checker_required'] and r['aal2_required']
          assert r['idempotency_replay_same_receipt']
          assert r['live_veni_account_auth']=='NOT_CONNECTED'
          assert r['authority_context']=='SERVER_ONLY_REFERENCE_NOT_SESSION_PROOF'
          assert r['prod_postgres_migration']=='NOT_APPLIED'
          assert r['external_publication']=='NOT_GRANTED'
          print('C8 executed school isolation and unconnected live authority confirmed')
          PY
      - name: Archive synthetic evidence without passwords, DSNs or identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c8-pg-approval-${{ github.run_id }}
          path: |
            c8-output/pytest-results.xml
            c8-output/c8-reference-summary.json
            c8-output/c8-reference-explained.html
          if-no-files-found: warn
          retention-days: 7
