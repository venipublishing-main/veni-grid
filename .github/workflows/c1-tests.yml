name: C1 full source conformance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c1-conformance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  c1-full-suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up reviewed Python runtime
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install reviewed direct dependencies and local source
        run: python -m pip install -c requirements-solver-reviewed.txt -e ".[solver,test]"
      - name: Verify installed dependency compatibility
        run: python -m pip check
      - name: Verify import, rebuild fixtures, run 423 tests and 12 solver cases
        run: python -m scripts.run_ci
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c1-full-conformance-${{ github.run_id }}
          path: |
            ci-output/
            evidence_solver/
          if-no-files-found: warn
          retention-days: 7
