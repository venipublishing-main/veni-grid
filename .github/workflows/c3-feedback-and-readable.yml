name: C3 resource-aware feedback and readable timetable
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout without stored credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install reviewed dependencies
        run: python -m pip install -c requirements-solver-reviewed.txt -e ".[solver,test]"
      - name: Regenerate original synthetic fixtures
        run: |
          python -m pip check
          python -m scripts.prepare_workspace
          mkdir -p c3-output readable
      - name: Generate actual C2 teaching evidence required by C3 display tests
        run: python -m scripts.run_c2_probes
      - name: Run 549 regressions including human-readable C3 checks
        run: python -m pytest -q tests tests_solver quality_tests q2_tests q3_tests o1_tests c2_tests c3_tests --junitxml=c3-output/c3-junit.xml
      - name: Require full regression count, no errors and no skipped checks
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('c3-output/c3-junit.xml').getroot()
          n={key:sum(int(s.attrib.get(key,0)) for s in root.iter('testsuite')) for key in ('tests','failures','errors','skipped')}
          assert n=={'tests':549,'failures':0,'errors':0,'skipped':0},n
          print('C3 full baseline:',n)
          PY
      - name: Render layperson timetable directly from validated assignments
        run: python -m scripts.render_c2_for_people
      - name: Execute true C3 O1/C2 feedback and proposals
        run: python -m scripts.run_c3_probes
      - name: Verify user-facing outputs and response boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('readable/c2-teaching-display-source.json').read_text())
          r=json.loads(Path('c3-output/c3-summary.json').read_text())
          assert a['kind']=='ACTUAL_VALIDATED_C2_CANDIDATE' and a['count']==18 and a['sections']==9
          assert r['status']=='PROPOSED_VALIDATED' and r['hard_validation']=='PASSED'
          assert r['compulsory_requests']==6 and r['requests_fulfilled']==6
          assert r['original_unchanged'] and r['approval']=='NOT_GRANTED'
          assert r['moved_subject_families']==1
          assert {row['subject'] for row in r['plain_english_rows']}=={'Subject A','Subject B'}
          assert {row['before'] for row in r['plain_english_rows']}=={'08:00'}
          assert sorted(row['after'] for row in r['plain_english_rows'])==['08:00','09:20']
          assert sum(row['moved'] for row in r['plain_english_rows'])==1
          assert r['other_schedules']=='NOT_READ_OR_CHANGED'
          print('Actual C2 timetables and proposed-only C3 feedback verified')
          PY
      - name: Check standalone display scripts parse in Node
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('readable/c2-teaching-timetable-explained.html').read_text()
          Path('/tmp/grid-human.js').write_text(p.rsplit('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/grid-human.js
      - name: Save synthetic C3 verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c3-feedback-${{ github.run_id }}
          path: |
            c3-output/
            readable/
          if-no-files-found: warn
          retention-days: 7
